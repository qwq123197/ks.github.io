<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ks官方</title>
    <style>
        /* 按钮样式 */
        button {
            padding: 10px 20px;
            background-color: #87CEEB; /* 天蓝色 */
            color: black; /* 黑色文字 */
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            margin-right: 10px; /* 按钮间距 */
        }
        button:hover {
            background-color: #6CA6CD; /* 悬停时稍深的蓝色 */
        }

        /* 大型弹窗样式 */
        .modal {
            display: none; /* 默认隐藏 */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5); /* 半透明背景 */
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
    </style>
</head>
<body>
    <header>
        <h1>欢迎来到ks官方</h1>
        <nav>
            <ul>
                <li><a href="#about">关于</a></li>
                <li><a href="#services">服务</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
        </nav>
    </header>

    <section id="about">
        <h2>关于我们</h2>
        <p>本网站仅1人搭建，求打赏！</p>
    </section>

    <section id="services">
        <h2>我们的服务</h2>
        <ul>
            <li>滚</li>
            <li>滚</li>
            <li>滚</li>
        </ul>
    </section>

    <section id="contact">
        <h2>联系我们</h2>
        <p>QQ:3655699298</p>
        <!-- 新增按钮 -->
        <button onclick="showTeam()">作者</button>
        <button onclick="showTerms()">用户条款</button>
        <button onclick="downloadFile()">下载文件</button>
    </section>

    <footer>
        <p>&copy; 2025 ks官方网站. 保留所有权利。</p>
    </footer>

    <!-- 大型弹窗 -->
    <div id="termsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Ks助手用户条款</h2>
            <p>这里是用户条款的具体内容。你可以在这里详细说明用户使用本网站时需要遵守的规则和条款。</p>
            <p>例如：</p>
            <ul>
                <li>用户不得利用本网站进行非法活动。</li>
                <li>用户应保护自己的账号信息，避免泄露。</li>
                <li>本网站保留随时修改条款的权利。</li>
            </ul>
        </div>
    </div>

    <script>
        // JavaScript 函数：显示制作团队信息
        function showTeam() {
            alert("制作团队：ks官方");
        }

        // JavaScript 函数：显示用户条款弹窗
        function showTerms() {
            const modal = document.getElementById("termsModal");
            modal.style.display = "block";
        }

        // JavaScript 函数：关闭弹窗
        function closeModal() {
            const modal = document.getElementById("termsModal");
            modal.style.display = "none";
        }

        // 点击弹窗外区域关闭弹窗
        window.onclick = function(event) {
            const modal = document.getElementById("termsModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }

        // JavaScript 函数：下载文件
        function downloadFile() {
            // 创建一个虚拟的下载链接
            const link = document.createElement("a");
            link.href = "/storage/emulated/0/MT2/apks/Ks助手_1.9.apk"; // 替换为实际文件路径
            link.download = "Ks助手官方版.apk"; // 替换为实际文件名
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
